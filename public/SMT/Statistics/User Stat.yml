info:
  name: User Stat
  type: http
  seq: 3

http:
  method: GET
  url: "{{LOCAL_BASE_URL}}analytics/users-with-stats?search=Admin&per_page=10"
  params:
    - name: department_id
      value: "1"
      type: query
      disabled: true
    - name: role
      value: faculty
      type: query
      disabled: true
    - name: status
      value: active
      type: query
      disabled: true
    - name: search
      value: Admin
      type: query
