info:
  name: email
  type: http
  seq: 2

http:
  method: POST
  url: "{{LOCAL_BASE_URL}}http://127.0.0.1:8000/api/v1/users/verify-by-email"
  headers:
    - name: X-XSRF-TOKEN
      value: %3D
      disabled: true
    - name: Cookie
      value: XSRF-%3D; smt-%3D
      disabled: true
    - name: Referer
      value: https://smt.tfnsolutions.us
      disabled: true
    - name: Content-Type
      value: application/json
      disabled: true
    - name: Accept
      value: application/json
      disabled: true
  body:
    type: multipart-form
    data:
      - name: email
        type: text
        value: promisedeco24@gmail.com
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
