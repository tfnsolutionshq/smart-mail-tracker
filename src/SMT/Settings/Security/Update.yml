info:
  name: Update
  type: http
  seq: 1

http:
  method: PUT
  url: "{{NOTIFY_BASE_URL}}settings/security"
  body:
    type: json
    data: " {\r

      \    \"two_factor_authentication\": true,\r

      \    \"session_timeout\": 60,\r

      \    \"login_alerts\": true,\r

      \    \"password_expiry\": 90,\r

      \    \"change_password_required\": false,\r

      \    \"download_recovery_codes\": true\r

      \  }"
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
