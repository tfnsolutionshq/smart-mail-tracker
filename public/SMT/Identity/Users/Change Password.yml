info:
  name: Change Password
  type: http
  seq: 15

http:
  method: POST
  url: "{{LOCAL_BASE_URL}}change-password"
  body:
    type: json
    data: "{\r

      \  \"current_password\": \"12345678\",\r

      \  \"new_password\": \"password\",\r

      \  \"new_password_confirmation\": \"password\"\r

      }"
  auth:
    type: bearer
    token: "{{TOKEN}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
